version: '3.9'
services:
  postgres:
    image: postgres:16
    container_name: hive_postgres
    restart: always
    environment:
      POSTGRES_USER: hive_user
      POSTGRES_PASSWORD: hive_pass
      POSTGRES_DB: hive_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data:
